[package]
name = "slice-capacity"
version = "0.1.0"
edition = "2021"
description = "Go 슬라이스의 len/cap/재할당 규칙을 브라우저에서 재현하는 Wasm 모듈"
license = "MIT"
repository = "https://github.com/FelixBaek/felixbaek.github.io"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-opt 설정 (중요)
# -----------------------------------------------------------------------------
# Rust 1.87+ 는 wasm32-unknown-unknown 에서 bulk-memory 명령을 기본으로 생성한다.
# 그런데 wasm-pack 이 부르는 wasm-opt 는 기본 feature set 에서 bulk-memory 를 꺼 둔
# 상태로 검증해 다음 에러로 죽는다:
#
#   [wasm-validator error] unexpected false:
#   Bulk memory operations require bulk memory [--enable-bulk-memory]
#   Fatal: error validating input
#
# 실패하면 wasm-pack 은 미최적화 .wasm 을 그대로 남기고 종료 코드만 0이 아닌 값을 낸다.
# (파이프로 감싸 실행하면 이 실패를 놓치기 쉽다.)
# → 아래처럼 필요한 feature 를 명시해 최적화를 살린다.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
