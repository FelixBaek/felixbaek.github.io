# Pagefind 인덱싱 설정
#  - force_language: ko
#      페이지별 lang 감지에 의존하지 않고 한국어 단일 인덱스를 만든다.
#      (Pagefind 의 한국어 지원: UI 번역 ✅ / stemming ❌ / CJK 분절 ✅)
#  - exclude_selectors: 사이드바·TOC·푸터 같은 UI 텍스트를 인덱스에서 제거한다.
site: dist
force_language: ko
keep_index_url: false
verbose: false

exclude_selectors:
  - "[data-pagefind-ignore]"
  - ".col-side"
  - ".col-aside"
  - ".topbar"
  - ".site-footer"
  - ".drawer"
  - ".scrim"
  - ".toc-inline"
  - ".article-nav"
